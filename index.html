<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재경로지스 | Jeakyung Logis</title>
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="container header-main">
            <div class="logo">재경로지스</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">회사소개</a></li>
                    <li><a href="#">사업영역</a></li>
                    <li><a href="#">고객센터</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
        <div class="container hero-content">
            <h1 class="hero-title">최고의 물류 파트너<br>재경로지스입니다</h1>
            <p class="hero-subtitle">신속하고 정확한 배송, 안전한 물류 관리 서비스를 제공합니다.</p>
            <a href="#" class="btn-primary">서비스 문의하기</a>
        </div>
    </section>

    <!-- 메인 내용이 들어갈 자리 -->
    <main>
        <section class="services container" style="padding: 50px 0;">
            <h2 class="section-title">주요 서비스</h2>
            <div class="services-grid">
                <div class="service-card">
                    <h3>국내 운송</h3>
                    <p>전국 어디든 빠르고 안전하게 배송합니다.</p>
                </div>
                <div class="service-card">
                    <h3>보관 관리</h3>
                    <p>최적화된 창고 관리 시스템을 제공합니다.</p>
                </div>
                <div class="service-card">
                    <h3>물류 컨설팅</h3>
                    <p>귀사의 물류 효율을 극대화해 드립니다.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <footer>
        <div class="container footer-flex">
            <div class="footer-copyright">
                © 2026 재경로지스. All rights reserved.
            </div>
        </div>
    </footer>

</body>
</html>
