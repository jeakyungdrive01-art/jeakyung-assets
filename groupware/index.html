    <script>
      // 404.html이 저장해둔 원래 경로가 있으면, 라우터가 초기화되기 전에 복원한다.
      (function () {
        var redirect = sessionStorage.getItem('gw-redirect');
        if (redirect) {
          sessionStorage.removeItem('gw-redirect');
          var current = window.location.pathname + window.location.search + window.location.hash;
          if (redirect !== current) history.replaceState(null, '', redirect);
        }
      })();
    </script>
